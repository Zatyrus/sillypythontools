[project]
name = "sillypythontools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bela Vogler", email = "bela.vogler@uni-jena.de" }
]
requires-python = ">=3.14"
dependencies = [
    "ruff>=0.17.4",
]

[project.scripts]
sillypythontools = "sillypythontools:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
qr = [
    "pillow>=13.0.0",
    "qrcode>=8.2",
]
url-caller = [
    "progress>=1.6.1",
    "rich>=15.0.0",
]
